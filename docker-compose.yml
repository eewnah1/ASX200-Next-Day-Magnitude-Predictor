services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: asx200-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/asx200_predictor.db
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "asx200_mag_predictor.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: asx200-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000/api/v1
    depends_on:
      - api
    command: ["streamlit", "run", "src/asx200_mag_predictor/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
