services:
  - type: web
    name: asx200-mag-predictor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/asx200_predictor.db
      - key: DATA_DIR
        value: /data
      - key: TZ
        value: Australia/Sydney
      - key: NEWSAPI_API_KEY
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: TRADINGVIEW_MCP_FAILURE_COOLDOWN_S
        value: "0"
      - key: TRADINGVIEW_MCP_RETRY_DELAYS
        value: "0.0"
      - key: TRADINGVIEW_MCP_SOCKET_TIMEOUT
        value: "10"
      - key: TRADINGVIEW_MCP_MAX_INFLIGHT
        value: "1"
    disk:
      name: asx200-data
      mountPath: /data
      sizeGB: 1
