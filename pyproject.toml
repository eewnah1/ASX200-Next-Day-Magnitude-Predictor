[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asx200-magnitude-predictor"
version = "0.1.0"
description = "ASX200 Next-Day Magnitude Predictor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "H Tan" }
]
classifiers = [
    "Programming Language \u00b7 Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "requests>=2.32.0",
    "apscheduler>=3.10.0",
    "python-dateutil>=2.9.0",
    "plotly>=5.22.0",
    "httpx>=0.27.0",
    "pytz>=2024.1",
    "tzlocal>=5.2",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "tradingview-mcp-server>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "coverage>=7.5.0",
]

[project.scripts]
asx-predict = "asx200_mag_predictor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asx200_mag_predictor"]

[tool.hatch.build.targets.wheel.force-include]
"src/asx200_mag_predictor/data/seed_ml_models" = "asx200_mag_predictor/data/seed_ml_models"

[tool.hatch.build]
include = [
    "src/asx200_mag_predictor/**",
    "src/asx200_mag_predictor/data/seed_ml_models/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
